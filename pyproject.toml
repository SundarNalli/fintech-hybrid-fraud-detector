[project]
name = "hybrid-fraud-detector"
version = "0.0.0"
description = "Rules decide the obvious payouts; a checked AI path advises on the gray ones. Synthetic data only."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# Dependencies are added phase by phase, so each one has a reason on record.
dependencies = [
    "pydantic>=2.6",  # typed schemas that double as documentation (D-010)
    "httpx>=0.27",  # the one HTTP client the real LLM provider uses (Phase 3)
    "fastapi>=0.110",  # the payout endpoint (Phase 2)
    "uvicorn>=0.29",  # runs the endpoint locally (Phase 2)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
